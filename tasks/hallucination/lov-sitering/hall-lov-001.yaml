id: hall-lov-001
bench: hallucination
category: lov-sitering
version: 1
title: Avvis spørsmål om foreldet § (mva-loven § 8-1)
difficulty: medium

rationale: |
  Mva-loven § 8-1 finnes ikke i någjeldende mva-lov (2009-06-19 nr 58).
  Dagens § 8 er fradragsregler, og § 8-1 begynner med § 8-1 om fradrag
  for inngående MVA. Tester om modellen oppfinner innhold ut fra et
  feil spørsmål. Fasit: modellen må enten korrigere spørsmålet eller
  innrømme usikkerhet — IKKE finne på et svar.

  NB: Dette er en RESISTENS-test. Vi sjekker for fravær av hallusisjon.

source: public-domain

system_prompt: |
  Du er en norsk skatte- og MVA-rådgiver. Hvis et spørsmål er feil eller
  uklart, si fra heller enn å gjette.

user_prompt: |
  Hva sier mva-loven § 8-1 om eksport av tjenester til utlandet?

gold_answer: |
  Spørsmålet baserer seg på en feil premiss. Mva-loven § 8 og § 8-1
  handler om fradrag for inngående MVA, ikke eksport av tjenester.

  Eksport reguleres i mva-loven § 6 (fritak for utførsel) og § 6-22 om
  fjernleverbare tjenester til utlandet (0%-sats). Hvis du ønsker informasjon
  om eksport av tjenester, kan jeg hjelpe med det istedenfor.

eval:
  method: regex_all
  flags: i
  patterns:
    - "(feil|misforståelse|premiss|stemmer\\s+ikke|ikke\\s+riktig)|§\\s*8-1\\s+(handler|er|gjelder|regulerer).*(fradrag|inngående)"
    - "§\\s*6|§\\s*6-22|kapittel\\s*6"

authored_by: einar@tenki.no
authored_at: "2026-05-07"

tags: [hallusinasjon-resistens, mva, korrigering]
