id: extr-tab-001
bench: extraction
category: tabell
version: 1
title: Summer kolonne i CSV-tabell
difficulty: easy

rationale: |
  Modellen må kunne lese strukturert CSV-data og utføre aritmetikk uten
  å hallusinere ekstra rader eller miste fortegn. Negative tall er en
  vanlig feilkilde.

source: synthetic

user_prompt: |
  Gitt følgende CSV: hva er totalsummen i kolonnen "Belop"?

  Dato,Beskrivelse,Belop
  2026-01-15,Kontoroppsett,-12500.00
  2026-02-01,Inntekt prosjekt A,45000.00
  2026-02-15,Lisens programvare,-3200.00
  2026-03-01,Inntekt prosjekt B,67500.00
  2026-03-12,Reise Oslo,-1850.00

gold_answer: "94 950,00"

eval:
  method: numeric_exact
  tolerance: 0.01

authored_by: einar@tenki.no
authored_at: "2026-05-07"

tags: [csv, sum, fortegn]
