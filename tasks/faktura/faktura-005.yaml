id: faktura-005
category: faktura
version: 1
title: Faktura med rabatt og MVA på rabattert sum
difficulty: medium

rationale: |
  Vanlig forvirring: rabatt skal trekkes fra FØR MVA beregnes. Mange modeller
  feiler ved å regne MVA på brutto og deretter trekke rabatten fra. Dette er
  en bokføringsfeil som leder til feil MVA-rapportering.

source: synthetic

system_prompt: |
  Du er en norsk regnskaps-assistent. Svar kun med totalbeløpet inkl. MVA.

user_prompt: |
  Hva er totalbeløpet inkl. MVA på fakturaen?

  Vare A: 10 000,00 kr eks. MVA
  Rabatt: 15%
  MVA-sats: 25%

# 10 000 - 15% = 8 500
# 8 500 + 25% MVA = 10 625
gold_answer: "10 625,00"

eval:
  method: numeric_exact
  tolerance: 0.01

authored_by: einar@tenki.no
authored_at: "2026-05-06"

tags: [rabatt, mva-25, basis]
