# Apollo-tilpasset compose. Container `app-bench` for å matche Caddyfile-fragment
# på Apollo-VPS-en. Networks `tenki-net` (Caddy reach) + `supabase_default` (db).
services:
  app-bench:
    container_name: app-bench
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://bench.tenki.no
    restart: unless-stopped
    env_file: .env
    networks:
      - tenki-net
      - supabase_default
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('http').get('http://localhost:3000/api/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

networks:
  tenki-net:
    external: true
  supabase_default:
    external: true
