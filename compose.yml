# Apollo-tilpasset compose. Container `app-bench` for å matche Caddyfile-fragment
# på Apollo-VPS-en. Networks `tenki-net` (Caddy reach) + `supabase_default` (db).
services:
  app-bench:
    container_name: app-bench
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://bench.tenki.no
    restart: unless-stopped
    env_file: .env
    # Apollo Docker's embedded DNS (127.0.0.11) forwards til host-resolveren,
    # som er Tailscale MagicDNS. MagicDNS svarer ikke på public hostnames →
    # outbound fetch til auth.tenki.no feiler, og OIDC token-utveksling i
    # /api/auth/callback returnerer 502. Pin host→IP for det vi *vet* vi
    # snakker med — påvirker ikke docker-service-discovery på interne nett.
    extra_hosts:
      - "auth.tenki.no:193.200.238.120"
      - "tenki.no:193.200.238.120"
    networks:
      - tenki-net
      - supabase_default
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('http').get('http://localhost:3000/api/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

networks:
  tenki-net:
    external: true
  supabase_default:
    external: true
